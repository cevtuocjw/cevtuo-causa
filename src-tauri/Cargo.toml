[package]
name = "cevtuo-causa"
version = "0.5.0"
description = "Cevtuo Causa — local-first causal ledger"
authors = ["Cevtuo"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cevtuo_causa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native"] }
rand = "0.8"
base64 = "0.22"
